[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boxy-print-agent"
version = "0.1.0"
description = "Standalone Windows print agent for Boxy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "Pillow>=10.4,<13",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "pyinstaller>=6.11,<7",
]

[project.scripts]
boxy-print-agent = "boxy_print_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["boxy_print_agent*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
